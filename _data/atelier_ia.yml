# Atelier IA — independent formation pratique for Québec SMEs.
# Not a Mila product. See disclaimer_short on every public page.

name: Atelier IA
tagline: >-
  La plateforme francophone où les dirigeants de PME québécoises apprennent l'IA en pratiquant — mentorat live, communauté, et solutions prêtes à remixer — sans devoir devenir data scientists.
one_liner: IA concrète pour PME québécoises. On livre des workflows, pas des webinaires.
email: jacob.lavoie@ascientist.io
location: Montréal, Québec

disclaimer_short: >-
  Atelier IA est une formation indépendante de Jacob Lavoie. Ce n'est pas un programme de Mila, du PARI CNRC, ni d'un organisme public.
disclaimer_affiliation: >-
  Jacob Lavoie est chercheur en recherche appliquée à Mila — Institut québécois d'intelligence artificielle. Cette affiliation décrit son emploi; elle n'implique aucun endossement, aucun partenariat officiel, et aucun accès aux ressources, données ou clients de Mila.

