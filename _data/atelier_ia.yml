linkedin_cadence:
  - week: 1
    title: Mémoire d'entreprise vs ChatGPT amnésique
    hook: >-
      ChatGPT n'a pas de mémoire métier. Votre PME si — dans les têtes, pas dans les systèmes.
    cta: Liste d'attente Atelier IA.
  - week: 1
    title: Ce que je ne ferai pas avec vos données
    hook: Si le fournisseur entraîne sur votre boîte partagée, ce n'est pas de l'IA, c'est une fuite lente.
    cta: Diagnostic 30 min.
  - week: 2
    title: Trois processus d'une PME manufacturière
    hook: Qualité, maintenance, et le contremaître qui part. Un seul est un projet modèle. Les deux autres sont des agents.
    cta: Playbook mémoire d'usine.
  - week: 2
    title: Loi 25 en une page
    hook: Finalité, minimisation, sous-traitant, conservation. Le reste est du théâtre de conformité.
    cta: Fiche de la semaine 2 de la cohorte.
  - week: 3
    title: Le webinar ChatGPT n'est pas une adoption
    hook: Si rien n'a changé dans la file d'attente vendredi, vous n'avez pas adopté l'IA.
    cta: Cohorte — un workflow en production.
  - week: 3
    title: Prompt, SOP, outil
    hook: Un prompt sans procédure est un tour de magie. Une procédure sans outil est un classeur.
    cta: Méthode de la semaine 3.
  - week: 4
    title: Pourquoi je refuse le diagnostic clinique
    hook: Je travaille en neuro et en médical. Justement. L'ops clinique n'est pas le clinicat.
    cta: Playbook santé ops.
  - week: 4
    title: PARI, CRIM, Atelier IA
    hook: Les institutions font le premier projet R&D. Personne n'habite le jeudi suivant.
    cta: Positionnement complémentaire.
  - week: 5
    title: n8n, Make, Power Automate
    hook: Choisissez celui qui est déjà connecté à votre identité. Le meilleur outil est celui que le TI ne bloquera pas.
    cta: Semaine 5.
  - week: 5
    title: Mesurer ou se mentir
    hook: « On dirait que ça va plus vite » n'est pas un KPI. Minutes, erreurs, file.
    cta: Tableau d'une page.
  - week: 6
    title: Cas anonymisé (quand on en aura un)
    hook: Avant / après en minutes. Pas de logo volé.
    cta: Liste d'attente.
  - week: 6
    title: Invitation diagnostic
    hook: 30 minutes, 3 processus, 0 diapositives de « révolution ».
    cta: Courriel.

firewall:
  title: Cadre d'indépendance
  rules:
    - Vérifier par écrit la politique d'activités externes / propriété intellectuelle de Mila avant toute offre payante.
    - Aucune vente à un client PARI actif sans divulgation et, si requis, autorisation.
    - Aucun matériel, donnée, dépôt ou canal interne Mila réutilisé dans Atelier IA.
    - Aucune mention « programme Mila », « officiel Mila », ou logo Mila sur les pages Atelier IA.
    - Formulation autorisée — « Jacob Lavoie, chercheur en recherche appliquée à Mila, propose de façon indépendante… »
    - Santé — opérations seulement. Pas d'aide à la décision clinique.
    - Cas clients — anonymes par défaut; logos seulement avec autorisation écrite de l'entreprise, pas de Mila.
    - Facturation et contrats au nom de l'entité personnelle / incorporée, jamais de Mila.

subscription:
  thesis: La cohorte vend le résultat. L'abonnement vend le jeudi suivant.
  convert_when: Après la démo de la semaine 8, offre Atelier+ 30 jours à tarif alumni.
  target_conversion: 40 % des entreprises de la cohorte.
  defer_builder: Pas de SaaS « builder » avant 10 organisations payantes et 6 playbooks vraiment remixés.
  channels:
    - Santé / sciences de la vie (ops)
    - Manufacturier
    - Services professionnels
    - Commerce et retail
  weekly_ops:
    - 1 live mentorat 60 min (Jacob)
    - Office hours 30 min
    - 1 playbook ou cas ajouté par mois, pas par semaine
    - Modération asynchrone — pigiste FR dès 30 membres
